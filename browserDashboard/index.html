
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aarons Browser Dashboard</title>
    <script src="dashboard.js" defer></script>
</head>
<body>

    <h1>Browser Dashboard</h1>

    <p>Enter your name and a favorite website below.</p>

    <form id="dashboardForm">

        <label for="userName">Your Name:</label>
        <input type="text" id="userName" name="userName" required>

        <br><br>

        <label for="favoriteWebsite">Favorite Website:</label>
        <input type="text" id="favoriteWebsite" name="favoriteWebsite"
               placeholder="Enter a website" required>

        <br><br>

        <button type="submit">Submit</button>

    </form>

    <section id="output"></section>

</body>
</html>
