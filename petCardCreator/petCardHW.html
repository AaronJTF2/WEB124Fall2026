<!DOCTYPE html>
<!-- Aaron Cole - 9/6/2026 -->

<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Pet Gallery</title>

  <link rel="stylesheet" href="petCardHW-1.css">
  <script src="petCardHW.js" defer></script>

</head>

<body>

  <h1 id="galleryHeading">Pet Gallery</h1>

  <div class="galleryContainer">

    <img id="PetImage" src="" alt="Pet image">

    <dl class="petDetails">

      <dt>Name:</dt>
      <dd id="petName"></dd>

      <dt>Details:</dt>
      <dd id="petDescription"></dd>

      <dt>Owner:</dt>
      <dd id="petOwner"></dd>

      <dt>Owner Phone:</dt>
      <dd id="petPhone"></dd>

      <dt>Pet ID:</dt>
      <dd id="petID"></dd>

    </dl>

  </div>

  <div class="buttons">

    <button id="prev">Previous</button>
    <button id="next">Next</button>

  </div>

</body>

</html>
